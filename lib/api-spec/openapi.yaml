openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GoCopyAI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: quiz
    description: Business Maturity Quiz
  - name: ai
    description: AI generation tools
  - name: billing
    description: Billing and credits
  - name: admin
    description: Admin operations
  - name: social
    description: Social media publishing
  - name: storage
    description: Object storage upload and serving
  - name: video
    description: Video production pipeline (voiceover, talking head, b-roll)
  - name: brand-profiles
    description: Brand voice profiles
  - name: video-projects
    description: Video project workspace
  - name: calendar
    description: Content calendar
  - name: feedback
    description: Generation feedback and learning
  - name: competitor
    description: Competitor analysis
  - name: templates
    description: Content templates library
  - name: workspaces
    description: Agency workspaces and team management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── User / Profile ──────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/ensure:
    post:
      operationId: ensureUser
      tags: [users]
      summary: Ensure user record exists (upsert on first login)
      responses:
        "200":
          description: User record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── Dashboard summary ────────────────────────────────────────────────────────
  /users/me/dashboard:
    get:
      operationId: getDashboardSummary
      tags: [users]
      summary: Get dashboard summary (credits, recent generations, last quiz)
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # ── Quiz ─────────────────────────────────────────────────────────────────────
  /quiz/questions:
    get:
      operationId: getQuizQuestions
      tags: [quiz]
      summary: Get all quiz questions
      responses:
        "200":
          description: Quiz questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizQuestion"

  /quiz/submit:
    post:
      operationId: submitQuiz
      tags: [quiz]
      summary: Submit quiz answers and get results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizSubmission"
      responses:
        "200":
          description: Quiz results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"

  /quiz/results:
    get:
      operationId: listQuizResults
      tags: [quiz]
      summary: List quiz results for current user
      responses:
        "200":
          description: Quiz results list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizResult"

  /quiz/results/{id}:
    get:
      operationId: getQuizResult
      tags: [quiz]
      summary: Get a specific quiz result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quiz result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── AI Generation Tools ───────────────────────────────────────────────────────
  /ai/generate:
    post:
      operationId: generateContent
      tags: [ai]
      summary: Generate AI content for any tool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResult"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/generations:
    get:
      operationId: listGenerations
      tags: [ai]
      summary: List AI generations for current user
      parameters:
        - name: tool_type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Generations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiGeneration"

  /ai/generations/{id}:
    get:
      operationId: getGeneration
      tags: [ai]
      summary: Get a specific AI generation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiGeneration"

  # ── Billing ───────────────────────────────────────────────────────────────────
  /billing/plans:
    get:
      operationId: getPlans
      tags: [billing]
      summary: Get available subscription plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Create a Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  /billing/portal:
    post:
      operationId: createPortalSession
      tags: [billing]
      summary: Create a Stripe customer portal session
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalResponse"

  /billing/topup:
    post:
      operationId: topupCredits
      tags: [billing]
      summary: Purchase a one-time credit top-up pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupRequest"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  /billing/webhook:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Handle Stripe webhooks
      responses:
        "200":
          description: OK

  # ── Admin ─────────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin only)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersResponse"

  /admin/users/{id}/credits:
    patch:
      operationId: adminAdjustCredits
      tags: [admin]
      summary: Adjust user credits (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditAdjustment"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{id}/role:
    patch:
      operationId: adminUpdateRole
      tags: [admin]
      summary: Update user role (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/generations:
    get:
      operationId: adminListGenerations
      tags: [admin]
      summary: List all AI generations (admin only)
      parameters:
        - name: user_id
          in: query
          schema:
            type: integer
        - name: tool_type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Generations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiGeneration"

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Get aggregate admin stats (quiz, users, billing)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  # ── Video Production Pipeline ────────────────────────────────────────────────
  /video/voiceover:
    post:
      operationId: videoVoiceover
      tags: [video]
      summary: Generate voiceover audio from script text (ElevenLabs)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoVoiceoverRequest"
      responses:
        "200":
          description: Audio generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceoverResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /video/voices:
    get:
      operationId: getVideoVoices
      tags: [video]
      summary: List available ElevenLabs voices
      responses:
        "200":
          description: Available voices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicesList"

  /video/talking-head:
    post:
      operationId: videoTalkingHead
      tags: [video]
      summary: Start a D-ID talking head video job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoTalkingHeadRequest"
      responses:
        "200":
          description: Job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoJobStarted"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /video/broll:
    post:
      operationId: videoBroll
      tags: [video]
      summary: Start Runway b-roll clip generation from script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoBrollRequest"
      responses:
        "200":
          description: Jobs started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrollJobsStarted"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Service not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /video/jobs/{id}:
    get:
      operationId: getVideoJob
      tags: [video]
      summary: Poll a video generation job for status and result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoJobStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Brand Profiles ──────────────────────────────────────────────────────────
  /brand-profiles:
    get:
      operationId: listBrandProfiles
      tags: [brand-profiles]
      summary: List brand profiles
      responses:
        "200":
          description: List of brand profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandProfile"
    post:
      operationId: createBrandProfile
      tags: [brand-profiles]
      summary: Create brand profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandProfileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"

  /brand-profiles/{id}:
    get:
      operationId: getBrandProfile
      tags: [brand-profiles]
      summary: Get brand profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Brand profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"
        "404":
          description: Not found
    put:
      operationId: updateBrandProfile
      tags: [brand-profiles]
      summary: Update brand profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandProfile"
    delete:
      operationId: deleteBrandProfile
      tags: [brand-profiles]
      summary: Delete brand profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Video Projects ───────────────────────────────────────────────────────────
  /video-projects:
    get:
      operationId: listVideoProjects
      tags: [video-projects]
      summary: List video projects
      responses:
        "200":
          description: List of video projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoProject"
    post:
      operationId: createVideoProject
      tags: [video-projects]
      summary: Create video project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProject"

  /video-projects/{id}:
    get:
      operationId: getVideoProject
      tags: [video-projects]
      summary: Get video project with job details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProjectDetail"
        "404":
          description: Not found
    put:
      operationId: updateVideoProject
      tags: [video-projects]
      summary: Update video project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoProjectInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProject"
    delete:
      operationId: deleteVideoProject
      tags: [video-projects]
      summary: Delete video project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Content Calendar ─────────────────────────────────────────────────────────
  /calendar:
    get:
      operationId: listCalendarItems
      tags: [calendar]
      summary: List calendar items
      parameters:
        - name: month
          in: query
          schema:
            type: string
            description: YYYY-MM
      responses:
        "200":
          description: List of calendar items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarItem"
    post:
      operationId: createCalendarItem
      tags: [calendar]
      summary: Create calendar item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"

  /calendar/{id}:
    put:
      operationId: updateCalendarItem
      tags: [calendar]
      summary: Update calendar item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
    delete:
      operationId: deleteCalendarItem
      tags: [calendar]
      summary: Delete calendar item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /calendar/ai-fill:
    post:
      operationId: aiFillCalendar
      tags: [calendar]
      summary: AI-fill empty calendar slots for a month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiFillCalendarRequest"
      responses:
        "200":
          description: Generated and saved items
          content:
            application/json:
              schema:
                type: object
                required: [items, creditsUsed]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarItem"
                  creditsUsed:
                    type: number

  # ── Generation Feedback ──────────────────────────────────────────────────────
  /ai/feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      summary: Submit feedback on a generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer

  /ai/feedback/stats:
    get:
      operationId: getFeedbackStats
      tags: [feedback]
      summary: Get feedback stats for current user
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStats"

  # ── A/B Variant Generator ────────────────────────────────────────────────────
  /ai/variants:
    post:
      operationId: generateVariants
      tags: [ai]
      summary: Generate multiple copy variants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantsRequest"
      responses:
        "200":
          description: Variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantsResult"

  # ── Competitor Analysis ──────────────────────────────────────────────────────
  /competitor/analyse:
    post:
      operationId: analyseCompetitor
      tags: [competitor]
      summary: Analyse a competitor URL and generate counter-strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorAnalyseRequest"
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorAnalyseResult"

  # ── Templates ────────────────────────────────────────────────────────────────
  /templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List all content templates
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentTemplate"

  # ── Workspaces ───────────────────────────────────────────────────────────────
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List workspaces user belongs to
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceWithRole"
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a new workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceWithRole"

  /workspaces/{id}:
    get:
      operationId: getWorkspace
      tags: [workspaces]
      summary: Get workspace details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDetail"
    put:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Update workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceWithRole"
    delete:
      operationId: deleteWorkspace
      tags: [workspaces]
      summary: Delete workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /workspaces/{id}/members:
    get:
      operationId: listWorkspaceMembers
      tags: [workspaces]
      summary: List workspace members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMemberDetail"
    post:
      operationId: inviteWorkspaceMember
      tags: [workspaces]
      summary: Invite member by email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberDetail"

  /workspaces/{id}/members/{memberId}:
    delete:
      operationId: removeWorkspaceMember
      tags: [workspaces]
      summary: Remove member from workspace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

